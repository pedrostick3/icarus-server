name: icarus

services:
  icarus:
    build: ./server
    image: icarus-server:local
    container_name: icarus-server
    restart: unless-stopped        # volta a arrancar sozinho quando o Docker arranca (ex.: após reboot)
    stop_grace_period: 90s
    ports:
      - "${GAME_PORT:-17777}:${GAME_PORT:-17777}/udp"
      - "${QUERY_PORT:-27015}:${QUERY_PORT:-27015}/udp"
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SERVER_NAME: ${SERVER_NAME:-Icarus Caseiro}
      JOIN_PASSWORD: ${JOIN_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-4}
      GAME_PORT: ${GAME_PORT:-17777}
      QUERY_PORT: ${QUERY_PORT:-27015}
      LOAD_PROSPECT: ${LOAD_PROSPECT:-}
      RESUME_PROSPECT: ${RESUME_PROSPECT:-True}
      SHUTDOWN_IF_NOT_JOINED_FOR: ${SHUTDOWN_IF_NOT_JOINED_FOR:--1}
      SHUTDOWN_IF_EMPTY_FOR: ${SHUTDOWN_IF_EMPTY_FOR:--1}
      ALLOW_NON_ADMINS_LAUNCH: ${ALLOW_NON_ADMINS_LAUNCH:-True}
      ALLOW_NON_ADMINS_DELETE: ${ALLOW_NON_ADMINS_DELETE:-False}
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
      STEAM_BRANCH: ${STEAM_BRANCH:-}
      IMPORT_OVERWRITE: ${IMPORT_OVERWRITE:-false}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-60}
      CRASH_LIMIT: ${CRASH_LIMIT:-5}
      LOG_TO_STDOUT: ${LOG_TO_STDOUT:-true}
      EXTRA_ARGS: ${EXTRA_ARGS:-}
    volumes:
      - icarus-game:/opt/icarus     # ficheiros do jogo (re-descarregáveis, vários GB)
      # saves, config e logs — ISTO é o que importa. Por omissão num volume do Docker:
      # uma pasta do Windows (C:\...) partilhada com o contentor corta os ficheiros grandes
      # que o Wine lê. Em Linux/WSL podes usar ICARUS_DATA=./data.
      - ${ICARUS_DATA:-icarus-data}:/data
      - ./import:/import:ro         # larga aqui um prospect .json para o importar
      - ./backups:/backups:ro       # para restaurar backups
      - control:/control            # comandos manager -> servidor
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "3"

  manager:
    build: ./manager
    image: icarus-manager:local
    container_name: icarus-manager
    restart: unless-stopped
    depends_on:
      - icarus
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      SERVER_HOST: icarus
    volumes:
      - ${ICARUS_DATA:-icarus-data}:/data:ro
      - ./backups:/backups
      - ./config/rclone:/config/rclone   # rclone.conf (opcional; o rclone renova os tokens aqui)
      - control:/control
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  icarus-game:
  icarus-data:
  control:
