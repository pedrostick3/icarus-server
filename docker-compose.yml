name: icarus

services:
  icarus:
    build: ./server
    image: icarus-server:local
    container_name: icarus-server
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "${GAME_PORT:-17777}:${GAME_PORT:-17777}/udp"
      - "${QUERY_PORT:-27015}:${QUERY_PORT:-27015}/udp"
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SERVER_NAME: ${SERVER_NAME:-Icarus Caseiro}
      JOIN_PASSWORD: ${JOIN_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-4}
      GAME_PORT: ${GAME_PORT:-17777}
      QUERY_PORT: ${QUERY_PORT:-27015}
      LOAD_PROSPECT: ${LOAD_PROSPECT:-}
      RESUME_PROSPECT: ${RESUME_PROSPECT:-True}
      SHUTDOWN_IF_NOT_JOINED_FOR: ${SHUTDOWN_IF_NOT_JOINED_FOR:--1}
      SHUTDOWN_IF_EMPTY_FOR: ${SHUTDOWN_IF_EMPTY_FOR:--1}
      ALLOW_NON_ADMINS_LAUNCH: ${ALLOW_NON_ADMINS_LAUNCH:-True}
      ALLOW_NON_ADMINS_DELETE: ${ALLOW_NON_ADMINS_DELETE:-False}
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
      STEAM_BRANCH: ${STEAM_BRANCH:-}
      IMPORT_OVERWRITE: ${IMPORT_OVERWRITE:-false}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-60}
      LOG_TO_STDOUT: ${LOG_TO_STDOUT:-true}
      EXTRA_ARGS: ${EXTRA_ARGS:-}
    volumes:
      - icarus-game:/opt/icarus     # game files (re-downloadable, ~ several GB)
      - ./data:/data                # saves, config and logs — THIS is what matters
      - ./import:/import:ro         # drop a prospect .json here to import it
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "3"

  backup:
    build: ./backup
    image: icarus-backup:local
    container_name: icarus-backup
    restart: unless-stopped
    depends_on:
      - icarus
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_USERNAME: ${DISCORD_USERNAME:-Icarus Backup}
      DISCORD_MAX_FILE_MB: ${DISCORD_MAX_FILE_MB:-9.5}
      DISCORD_NOTIFY_PLAYERS: ${DISCORD_NOTIFY_PLAYERS:-true}
      DISCORD_NOTIFY_ERRORS: ${DISCORD_NOTIFY_ERRORS:-true}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-60}
      BACKUP_ONLY_IF_CHANGED: ${BACKUP_ONLY_IF_CHANGED:-true}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      BACKUP_ON_PLAYER_LEAVE: ${BACKUP_ON_PLAYER_LEAVE:-true}
      BACKUP_LEAVE_DELAY_SECONDS: ${BACKUP_LEAVE_DELAY_SECONDS:-120}
      BACKUP_MIN_GAP_MINUTES: ${BACKUP_MIN_GAP_MINUTES:-10}
      BACKUP_FILE_STABLE_SECONDS: ${BACKUP_FILE_STABLE_SECONDS:-15}
      BACKUP_PATHS: ${BACKUP_PATHS:-Saved/PlayerData/DedicatedServer}
      LOCAL_BACKUP_KEEP: ${LOCAL_BACKUP_KEEP:-72}
      PLAYER_JOIN_REGEX: ${PLAYER_JOIN_REGEX:-}
      PLAYER_LEAVE_REGEX: ${PLAYER_LEAVE_REGEX:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  icarus-game:
