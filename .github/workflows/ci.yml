name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependências
        run: |
          sudo apt-get update && sudo apt-get install -y jq unzip shellcheck
          pip install -r manager/requirements.txt
      - name: ShellCheck
        run: shellcheck server/*.sh
      - name: Testes
        working-directory: manager
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet
      - name: Build da imagem do manager
        run: docker build -t icarus-manager:ci manager
      - name: Smoke test do manager
        run: docker run --rm icarus-manager:ci --help
      - name: Build da imagem do servidor (Wine + SteamCMD)
        run: docker build -t icarus-server:ci server
      - name: Smoke test do Wine
        run: docker run --rm --entrypoint wine icarus-server:ci --version
